# Novedades de la scene para el cartel de Descubrir: cada 3 horas mira GitHub y actualiza escena.json.
# Lo gordo sale solo en la portada de Descubrir, y los proyectos nuevos que se pueden instalar llegan como pull request
# (propuesta de tarjeta para catalogo.json): Merge para añadirlo, Close para descartarlo.
# Necesita: Settings › Actions › General › Workflow permissions › «Read and write permissions» y
# «Allow GitHub Actions to create and approve pull requests».
name: Novedades de la scene
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
concurrency: escena
jobs:
  escena:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generar escena.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/escena.py escena.json "$RUNNER_TEMP/propuestas.json"
      - name: Subir si ha cambiado
        run: |
          git config user.name "escena-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add escena.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Novedades de la scene"
          git push
      - name: Proponer tarjetas nuevas para Descubrir
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin
          python3 tools/proponer.py "$RUNNER_TEMP/propuestas.json"
